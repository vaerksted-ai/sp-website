# Cloudflare Pages project: static site in ./public, Pages Functions in ./functions.
name = "synthetic-practitioner"
pages_build_output_dir = "./public"
compatibility_date = "2025-09-01"

[[d1_databases]]
binding = "DB"
database_name = "sp-waitlist"
# Replace with the id printed by `npx wrangler d1 create sp-waitlist` (see README).
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"
