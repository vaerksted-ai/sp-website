# Cloudflare Worker: serves the static site in ./public and the waitlist API.
name = "sp-website"
main = "src/index.js"
compatibility_date = "2025-09-01"

[assets]
directory = "./public"
binding = "ASSETS"

[[d1_databases]]
binding = "DB"
database_name = "sp-waitlist"
database_id = "5bad2dc4-e22c-4722-b186-5888a751f242"
migrations_dir = "migrations"
